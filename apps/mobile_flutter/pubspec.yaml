name: vital
description: VITAL — preventive health (Flutter port).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  webview_flutter: ^4.8.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

# Generate native launcher icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon-1024.png"
  adaptive_icon_background: "#FBF6EC"
  adaptive_icon_foreground: "assets/icon-foreground.png"
  remove_alpha_ios: true
